[package]
name = "chronos-vault"
version = "0.1.0"
description = "Chronos Vault — desktop time-series viewer for large CSV files"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
chronos-engine = { path = "../engine" }
